<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18263a">
<title>時間花園 | The Time Garden</title>
<style>
:root{--ink:#20302e;--cream:#fff9e9;--green:#395b49;--mint:#cce7bd;--gold:#f6c967;--pink:#ef9d9c}*{box-sizing:border-box}body{margin:0;background:#18263a;color:var(--cream);font-family:system-ui,"Microsoft JhengHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.brand{font-weight:1000;letter-spacing:.08em}.brand span{color:var(--gold)}.sub{font-size:11px;color:#b8c4bf}.board{position:relative;border:3px solid #f3e6c7;border-radius:24px;overflow:hidden;background:#9cc6b4;box-shadow:0 20px 60px #0006}.board canvas{width:100%;height:auto;aspect-ratio:960/560;display:block;touch-action:none}.hud{position:absolute;inset:14px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:start;gap:10px}.card{background:#fff9e9ed;color:var(--ink);padding:10px 14px;border-radius:15px;box-shadow:0 4px 12px #18352822}.card small{display:block;color:#537567;font-size:10px;font-weight:900;letter-spacing:.1em}.objective{font-weight:900;font-size:14px;margin-top:3px}.day{font-weight:1000;color:#42624e}.story{align-self:flex-start;width:min(540px,80%);border-left:5px solid #f3b84e;line-height:1.35}.story p{font-size:clamp(15px,2.2vw,21px);font-weight:900;margin:5px 0 2px}.story p span{color:#b35444}.translation{font-size:12px;color:#53635b}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px}.timeline,.tools{display:flex;gap:7px;pointer-events:auto}.timeline button,.tool,.advance,.restart{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #182b2340}.timeline button{background:#fff9e9;color:#365542}.timeline button.active{background:#f6c967;color:#3c3421}.tools{margin-left:auto}.tool{background:#fff9e9;color:#335847;touch-action:none}.tool[hidden]{display:none}.advance,.restart{background:#3d644b;color:white}.advance:disabled{opacity:.45;cursor:not-allowed}.panel{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 4px 0}.how{font-size:13px;line-height:1.7;color:#d0ddd7}.how b{color:#ffe39b}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);background:#fff8e6;color:#263c32;padding:13px 20px;border-radius:18px;font-weight:1000;box-shadow:0 8px 30px #0004;opacity:0;transition:.2s;pointer-events:none;text-align:center}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}@media(max-width:620px){.wrap{padding:12px}.head{align-items:start}.sub{max-width:130px;text-align:right}.hud{inset:8px}.card{padding:7px 9px}.objective{font-size:11px}.story{width:95%;padding:6px 9px}.translation{font-size:10px}.bottom{align-items:end}.timeline{gap:4px}.timeline button,.tool,.advance{padding:8px 9px;font-size:11px}.panel{display:block}.how{font-size:12px}.restart{margin-top:8px}}
</style></head>
<body><main class="wrap"><header class="head"><div class="brand">THE <span>TIME</span> GARDEN</div><div class="sub">一座會記得你行動的魔法花園</div></header>
<section class="board"><canvas id="garden" width="960" height="560" aria-label="互動時間花園"></canvas><div class="hud"><div class="top"><div class="card"><small id="phaseLabel">DAY 1 · YESTERDAY</small><div class="objective" id="objective">把月亮種子種進土裡</div></div><div class="card day" id="dayIcon">🌙</div></div>
<div class="card story"><small>MINA'S STORY · <span id="tenseName">PAST</span></small><p id="sentence">Yesterday, Mina <span>found</span> a Moon Seed.</p><div class="translation" id="translation">昨天，米娜找到了一顆月亮種子。</div></div>
<div class="bottom"><nav class="timeline"><button data-phase="past" class="active">🌙 昨天</button><button data-phase="now">☀️ 今天</button><button data-phase="future">✨ 明天</button></nav><div class="tools"><button class="tool" id="seed">🌰 月亮種子</button><button class="tool" id="water" hidden>🫗 澆水壺</button><button class="tool" id="basket" hidden>🧺 果籃</button><button class="advance" id="advance" hidden>前往明天 ➜</button></div></div></div><div class="toast" id="toast"></div></section>
<section class="panel"><div class="how" id="how"><b>怎麼玩：</b>按住「月亮種子」，拖到花園中央的土堆。每做一件事，故事就會用對應的時間說出來。</div><button class="restart" id="restart">重新開始 ↻</button></section></main>
<script>
(()=>{const c=document.querySelector('#garden'),x=c.getContext('2d'),$=id=>document.getElementById(id);let phase='past',planted=false,watered=false,advanced=false,harvested=false,drag=null,mouse={x:0,y:0},t=0,toastTimer;
const text={past:['DAY 1 · YESTERDAY','PAST','Yesterday, Mina <span>found</span> a Moon Seed.','昨天，米娜找到了一顆月亮種子。','把月亮種子種進土裡','按住「月亮種子」，拖到花園中央的土堆。'],now:['DAY 2 · TODAY','PRESENT PROGRESSIVE','Mina <span>is watering</span> the Moon Seed.','米娜正在替月亮種子澆水。','替種子澆水','按住「澆水壺」，拖到小苗上。看看種子正在發生什麼事。'],future:['DAY 3 · TOMORROW','FUTURE','The Moonflower <span>will bloom</span> tomorrow!','月亮花明天就會盛開！','收集月亮果','把果籃拖到盛開的花旁，完成米娜的故事。']};
function setPhase(p){phase=p;document.querySelectorAll('[data-phase]').forEach(b=>b.classList.toggle('active',b.dataset.phase===p));const a=text[p];$('phaseLabel').textContent=a[0];$('tenseName').textContent=a[1];$('objective').textContent=p==='past'?(planted?'月亮種子已種下':'把月亮種子種進土裡'):p==='now'?(watered?'小苗正在發光':'替種子澆水'):harvested?'花園完成！':advanced?(watered?'收集盛開的月亮花':'明天到了，種子還需要照顧'): '準備看看明天會怎樣';$('dayIcon').textContent=p==='past'?'🌙':p==='now'?'☀️':'✨';
if(p==='past'){$('sentence').innerHTML=planted?'Yesterday, Mina <span>planted</span> the Moon Seed.':'Yesterday, Mina <span>found</span> a Moon Seed.';$('translation').textContent=planted?'昨天，米娜種下了月亮種子。':'昨天，米娜找到了一顆月亮種子。'}else if(p==='now'){$('sentence').innerHTML=watered?'Mina <span>is caring for</span> the little sprout.':planted?'The Moon Seed <span>is waiting</span> for water.':'Mina <span>is looking</span> for a place to plant.';$('translation').textContent=watered?'米娜正在照顧小苗。':planted?'月亮種子正在等著喝水。':'米娜正在找地方種下種子。'}else{$('sentence').innerHTML=harvested?'Mina <span>will share</span> the Moonfruit with her friends.':!watered?'The seed <span>will not bloom</span> without water.':advanced?'The Moonflower <span>bloomed</span>! Mina <span>will collect</span> its fruit.':'The Moonflower <span>will bloom</span> tomorrow!';$('translation').textContent=harvested?'米娜會和朋友分享月亮果。':!watered?'沒有水，種子就不會開花。':advanced?'月亮花開了！米娜會收集果實。':'月亮花明天就會盛開！'}
$('seed').hidden=planted||phase!=='past';$('water').hidden=!planted||watered||phase!=='now';$('advance').hidden=phase!=='future'||advanced||!planted;$('advance').disabled=!watered;$('basket').hidden=phase!=='future'||!advanced||!watered||harvested;
$('how').innerHTML=harvested?'<b>故事完成：</b>你親自讓米娜的月亮花開花。回想一下：Yesterday she planted it, today she watered it, tomorrow it bloomed.':phase==='past'?'<b>怎麼玩：</b>按住「月亮種子」，拖到花園中央的土堆。Yesterday 描述已經發生的事。':phase==='now'?'<b>怎麼玩：</b>按住「澆水壺」，拖到小苗上。Today 描述正在發生的事。':'<b>怎麼玩：</b>按「前往明天」看你的照料造成什麼結果，再拖果籃去收果實。Will 說的是接下來會發生的事。';draw()}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function rounded(x0,y0,w,h,r,color){x.fillStyle=color;x.beginPath();x.roundRect(x0,y0,w,h,r);x.fill()}function ellipse(a,b,rx,ry,color){x.fillStyle=color;x.beginPath();x.ellipse(a,b,rx,ry,0,0,Math.PI*2);x.fill()}
function draw(){const W=960,H=560;let sky=phase==='past'?'#263956':phase==='now'?'#9ed5cf':'#f6c979',ground=phase==='past'?'#345349':'#6d9d67';let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,sky);g.addColorStop(1,phase==='past'?'#7888a1':'#e8dda4');x.fillStyle=g;x.fillRect(0,0,W,H);
// sky and time motifs
if(phase==='past'){ellipse(790,95,39,39,'#fff0bc');for(let i=0;i<22;i++){let a=(i*97)%W,b=(i*53)%260;x.fillStyle='#fff8cf';x.globalAlpha=.45+Math.sin(t/18+i)*.25;x.beginPath();x.arc(a,b,1.5+(i%2),0,7);x.fill()}x.globalAlpha=1}else{ellipse(790,92,47,47,'#ffe78e');ellipse(790,92,59,59,'#ffe78e33')}
// distant hills
x.fillStyle=phase==='past'?'#485c68':'#8ab68a';x.beginPath();x.moveTo(0,340);for(let i=0;i<=10;i++)x.lineTo(i*105,290+Math.sin(i*1.7)*35);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle=ground;x.beginPath();x.moveTo(0,380);x.quadraticCurveTo(250,320,500,385);x.quadraticCurveTo(760,440,960,340);x.lineTo(960,560);x.lineTo(0,560);x.fill();
// path and flower beds
x.fillStyle='#d9c394';x.beginPath();x.moveTo(385,560);x.quadraticCurveTo(445,460,450,376);x.quadraticCurveTo(555,344,610,560);x.fill();
// grass tufts
for(let i=0;i<38;i++){let xx=(i*137)%960,yy=390+(i*71)%155;x.strokeStyle=i%2?'#b3cd83':'#d6dc91';x.lineWidth=3;x.beginPath();x.moveTo(xx,yy+10);x.quadraticCurveTo(xx-6,yy,xx-8,yy-4);x.moveTo(xx,yy+10);x.quadraticCurveTo(xx+3,yy,xx+8,yy-6);x.stroke()}
// soil patch
ellipse(520,414,119,36,'#485438');ellipse(520,410,103,27,'#63483c');
// Mina simple storybook character
// shadow
ellipse(233,492,59,14,'#27443b55');rounded(198,393,70,94,22,'#e67e63');rounded(207,419,52,68,16,'#e8a274');ellipse(233,358,39,43,'#f0bd8c');x.fillStyle='#593d35';x.beginPath();x.arc(233,354,42,Math.PI,Math.PI*2);x.lineTo(273,366);x.quadraticCurveTo(252,347,208,365);x.fill();ellipse(220,360,3,4,'#382d2c');ellipse(246,360,3,4,'#382d2c');x.strokeStyle='#9a5146';x.lineWidth=2;x.beginPath();x.arc(233,371,9,.2,2.8);x.stroke();
// arms
x.strokeStyle='#f0bd8c';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(203,420);x.lineTo(175,449);x.moveTo(263,420);x.lineTo(289,443);x.stroke();
// sprout stage changes from actual action and future
let sprout=planted?watered?(advanced?3:2):1:0;if(sprout){x.strokeStyle='#426f42';x.lineWidth=8;x.beginPath();x.moveTo(520,408);x.quadraticCurveTo(517,365,520,328);x.stroke();ellipse(501,365,22,10,'#78b966');ellipse(539,347,22,10,'#78b966');if(sprout>=2){ellipse(491,333,20,10,'#a4d879');ellipse(550,323,20,10,'#a4d879')}if(sprout>=3){for(let i=0;i<8;i++){let a=i*Math.PI/4+t*.01;ellipse(520+Math.cos(a)*27,305+Math.sin(a)*22,14,10,'#f7a8bd')}ellipse(520,305,14,14,'#f6d36a');if(harvested){ellipse(567,348,10,14,'#d4b6ed');ellipse(579,350,10,14,'#d4b6ed')}}}
// seed if not planted
if(!planted){ellipse(520,398,13,18,'#9c7441');ellipse(515,392,4,6,'#dbb86e')}
// tools placed near character when not dragging
if(phase==='past'&&!planted){drawSeed(142,476)}if(phase==='now'&&planted&&!watered)drawCan(320,464);if(phase==='future'&&advanced&&watered&&!harvested)drawBasket(664,460);
if(drag){if(drag.type==='seed')drawSeed(mouse.x,mouse.y);else if(drag.type==='water')drawCan(mouse.x,mouse.y);else drawBasket(mouse.x,mouse.y)}
// soft captions
x.fillStyle='#20362b';x.font='bold 14px system-ui';x.fillText(phase==='past'?'Mina found a seed…':phase==='now'?'A little sprout is growing…':harvested?'The garden is full of moonlight!':advanced&&!watered?'The seed stayed asleep…':'Tomorrow is just ahead…',24,535);t++}
function drawSeed(a,b){ellipse(a,b,13,19,'#947041');ellipse(a-4,b-5,4,7,'#d6b46b');x.strokeStyle='#54724d';x.lineWidth=3;x.beginPath();x.moveTo(a+3,b-16);x.quadraticCurveTo(a+17,b-27,a+20,b-19);x.stroke()}function drawCan(a,b){rounded(a-24,b-14,39,31,8,'#6ea6c1');x.strokeStyle='#d4eff4';x.lineWidth=5;x.beginPath();x.arc(a-1,b,19,-1.2,1.3);x.stroke();x.fillStyle='#6ea6c1';x.beginPath();x.moveTo(a+13,b-10);x.lineTo(a+31,b-20);x.lineTo(a+34,b-15);x.lineTo(a+14,b-3);x.fill();x.fillStyle='#9fe2f2';for(let j=0;j<4;j++){x.beginPath();x.arc(a+37+j*5,b-6+j*7,2.5,0,7);x.fill()}}function drawBasket(a,b){rounded(a-26,b-9,53,30,8,'#bd8754');x.strokeStyle='#f0cc91';x.lineWidth=5;x.beginPath();x.arc(a,b-5,20,Math.PI,Math.PI*2);x.stroke();for(let j=-1;j<=1;j++){x.strokeStyle='#e1b57a';x.lineWidth=2;x.beginPath();x.moveTo(a+j*12,b-6);x.lineTo(a+j*12,b+18);x.stroke()}}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*560/r.height}}function startDrag(type,e){e.preventDefault();drag={type,id:e.pointerId};mouse=point(e);document.addEventListener('pointermove',move);document.addEventListener('pointerup',end,{once:true})}function move(e){mouse=point(e);draw()}function end(e){if(!drag)return;mouse=point(e);let type=drag.type;drag=null;document.removeEventListener('pointermove',move);if(mouse.x>390&&mouse.x<660&&mouse.y>365&&mouse.y<455){if(type==='seed'&&phase==='past'&&!planted){planted=true;notify('種子種下了！它已經成為昨天發生的事。');setPhase('past');setPhase('now')}else if(type==='water'&&phase==='now'&&planted&&!watered){watered=true;notify('正在澆水！小苗長出來了。');setPhase('now')}else if(type==='basket'&&phase==='future'&&advanced&&watered&&!harvested){harvested=true;notify('收集成功！故事完成 🌙');setPhase('future')}}draw()}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('pointerdown',e=>startDrag(b.id,e)));document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>setPhase(b.dataset.phase));$('advance').onclick=()=>{if(!watered){advanced=true;notify('種子沒有喝水，明天沒有開花。回到今天試試！')}else{advanced=true;notify('你照顧了它，月亮花真的開了！')}setPhase('future')};$('restart').onclick=()=>{planted=watered=advanced=harvested=false;setPhase('past');notify('新的一段時間旅程開始了。')};setPhase('past');draw();(function loop(){draw();requestAnimationFrame(loop)})();
})();
</script></body></html>
